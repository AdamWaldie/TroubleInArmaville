name: Publish to Steam Workshop

# Manual, on-demand publish of one or more terrain missions to the Steam
# Workshop (Arma 3, appid 107410), via steamcmd's `workshop_build_item`.
#
# This is deliberately manual (workflow_dispatch only, credentials typed in
# per run) rather than tied to the tag-push Release workflow: a Workshop
# publish is a one-way, public action against a real Steam account, and
# should never fire as a side effect of cutting a release tag.
#
# SECURITY NOTE: workflow_dispatch inputs are NOT secret. GitHub shows the
# values you type here in the run's "triggered with inputs" panel to anyone
# with read access to this repository - the ::add-mask:: below only keeps
# them out of the raw step logs, it does not hide them from that panel.
# Prefer a dedicated Steam account added as a Workshop contributor on the
# Arma 3 app over typing in your main account's password, if that's ever a
# concern.
#
# Workshop items are created once and updated after that (see
# steam/workshop_ids.json). A terrain whose ID is still 0 gets a brand-new
# item on this run; steamcmd prints the ID it was assigned in the log -
# copy that into steam/workshop_ids.json and commit it, or the next run
# creates a second, duplicate item instead of updating the first.
#
# Content is built the same way release.yml builds it (same staging,
# validation, and per-terrain mission.sqm resolution), but left as an
# unpacked folder rather than zipped/pbo'd: Steam Workshop mission items are
# the unpacked mission folder, not a .pbo.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to publish"
        required: true
      terrains:
        description: "Space-separated terrains to publish (default: all supported terrains)"
        required: false
        default: "Altis Tanoa Stratis Enoch Malden"
      steam_username:
        description: "Steam account username"
        required: true
      steam_password:
        description: "Steam account password (NOT masked outside step logs - see workflow header)"
        required: true
      steamguard_code:
        description: "Current Steam Guard code for this account (one-time, only needed if the account requires it)"
        required: false
        default: ""
      visibility:
        description: "Workshop visibility for any items created this run (existing items keep their current visibility unless changed here)"
        required: true
        default: "private"
        type: choice
        options:
          - private
          - friends-only
          - public
      changenote:
        description: "Workshop changenote for this update"
        required: false
        default: "Automated update via GitHub Actions"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mask credentials in step logs
        run: |
          echo "::add-mask::${{ inputs.steam_password }}"
          echo "::add-mask::${{ inputs.steamguard_code }}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Validate SQF
        run: python3 tools/ci/sqf_validator.py
      - name: Validate Config
        run: python3 tools/ci/config_style_checker.py

      - name: Stage the mission once
        run: |
          mkdir -p stage
          ./tools/ci/stage_mission.sh stage/_mission

      - name: Build one unpacked folder per requested terrain
        run: |
          mkdir -p workshop_content
          cd stage
          for TERRAIN in ${{ inputs.terrains }}; do
            NAME="TroubleInArmaville.${TERRAIN}"
            rm -rf "$NAME"
            cp -r _mission "$NAME"

            OVERRIDE="../terrains/${TERRAIN}/mission.sqm"
            ANCHOR=$(python3 ../.github/scripts/terrain_anchor.py "$TERRAIN" ../.github/terrains.json)

            if [ -f "$OVERRIDE" ]; then
              echo "$TERRAIN: using the supplied, in-editor-verified mission.sqm"
              cp "$OVERRIDE" "$NAME/mission.sqm"
            elif [ -n "$ANCHOR" ]; then
              echo "$TERRAIN: recentring player positions onto researched anchor ($ANCHOR)"
              python3 ../.github/scripts/patch_mission_positions.py "$NAME/mission.sqm" $ANCHOR
            else
              echo "$TERRAIN: shipping mission.sqm as authored (only known-correct for Altis)"
            fi

            mv "$NAME" "../workshop_content/$NAME"
          done

      - name: Install steamcmd
        run: |
          mkdir -p "$HOME/steamcmd"
          curl -sSL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz \
            | tar -xz -C "$HOME/steamcmd"

      - name: Generate a workshop VDF per terrain
        run: |
          set -euo pipefail
          case "${{ inputs.visibility }}" in
            public) VIS=0 ;;
            friends-only) VIS=1 ;;
            *) VIS=2 ;;
          esac
          mkdir -p steam/vdf
          for TERRAIN in ${{ inputs.terrains }}; do
            python3 .github/scripts/generate_workshop_vdf.py \
              --terrain "$TERRAIN" \
              --content-folder "$(pwd)/workshop_content/TroubleInArmaville.${TERRAIN}" \
              --preview-file "$(pwd)/steam/workshop_preview.png" \
              --description-file "$(pwd)/steam/workshop_description.md" \
              --ids-file "$(pwd)/steam/workshop_ids.json" \
              --changenote "${{ inputs.changenote }} (${{ inputs.tag }})" \
              --visibility "$VIS" \
              --out "steam/vdf/${TERRAIN}.vdf"
          done

      - name: Publish to Steam Workshop
        run: |
          set -euo pipefail
          STEAMCMD_ARGS=(+login "${{ inputs.steam_username }}" "${{ inputs.steam_password }}")
          if [ -n "${{ inputs.steamguard_code }}" ]; then
            STEAMCMD_ARGS+=("${{ inputs.steamguard_code }}")
          fi
          for TERRAIN in ${{ inputs.terrains }}; do
            STEAMCMD_ARGS+=(+workshop_build_item "$(pwd)/steam/vdf/${TERRAIN}.vdf")
          done
          STEAMCMD_ARGS+=(+quit)
          "$HOME/steamcmd/steamcmd.sh" "${STEAMCMD_ARGS[@]}"

      - name: Reminder - record any newly created item IDs
        if: always()
        run: |
          echo "If any terrain above was published for the first time (publishedfileid=NEW in the"
          echo "'Generate a workshop VDF' step), find its assigned ID in the steamcmd output above"
          echo "and copy it into steam/workshop_ids.json, then commit - otherwise the next run"
          echo "creates a duplicate Workshop item for that terrain instead of updating this one."
